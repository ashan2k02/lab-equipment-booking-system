{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ title }}</h1>
</div>

<div class="card form-card">
  <form method="post">
    <div class="form-group">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" type="text" id="name" name="name" value="{{ values.get('name', '') }}" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="category">Category</label>
      <input class="form-control" type="text" id="category" name="category" value="{{ values.get('category', '') }}" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="description">Description</label>
      <textarea class="form-control" id="description" name="description" rows="3">{{ values.get('description', '') }}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label" for="status">Status</label>
      <select class="form-control" id="status" name="status">
        {% for s in statuses %}
        <option value="{{ s }}" {% if values.get('status') == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-secondary" href="{{ url_for('equipment.list_equipment') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
